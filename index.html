<!DOCTYPE html>
<html lang="en">
    <head>
        <title>S0llis's Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./src/style/main.css">
        <link rel="stylesheet" href="./src/style/header.css">
        <link rel="stylesheet" href="./src/style/hero.css">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <div class="hero-logo">
                <img class="logo" src="/icons/hero-icon.svg" alt="logo">
                <p class="nickname">S0llis</p>
            </div>
            <nav class="navigation">
                <ul>
                    <li><a href="#about">About</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
            <div class="icons">
                <a class="hire-button" href="#contact">Get in Touch</a>
            </div>
        </header>
        
        <main>
            <section class="hero">
                <img class="main-background" src="/images/main-background.png" alt="background">
                <img class="hero-avatar" src="/images/avatar.png" alt="me">
                <div>
                    <h1 class="hero-role-first">Full-Stack</h1>
                    <h2 class="hero-role-second">Web Developer</h2>
                    <h2 class="hero-role-second-front">Web Developer</h2>
                </div>
            </section>
        </main>
    </body>
</html>
